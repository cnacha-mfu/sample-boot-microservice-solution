# SOLUTION for step 2 and step 5.

spring.application.name=library-transaction-service
server.port=8100

# Its own database, in memory, separate from the book database.
spring.datasource.url=jdbc:h2:mem:transactiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Step 2. fetch-registry matters more here than in book-service: this service has
# to READ the list to find out where library-book-service is.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Step 5: do not wait forever for the other service.
#
# Two seconds to connect, two seconds for an answer, then give up. Without a
# timeout, one slow service holds a thread here for every request, and when the
# threads run out this service stops answering too - a failure in one program
# spreading to another.
feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=2000

# ---------------------------------------------------------------------------
# Given to the students already set: making Eureka quick enough for a classroom.
#
# The defaults are tuned for a datacentre, not a lesson. A service waits 40
# seconds before it first announces itself, callers re-read the list every 30
# seconds, and the load balancer caches it for another 35. A freshly started
# system can take well over a minute before the first call works, and until then
# the failure looks exactly like a bug in the student's own code.
#
# Worth saying out loud in step 6: these four lines are the only reason the demo
# is quick rather than glacial. It is still not instant - a new copy has to boot,
# announce itself, and be picked up. In production you would leave the defaults.
# ---------------------------------------------------------------------------
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s

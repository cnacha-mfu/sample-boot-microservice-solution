# SOLUTION for step 2 and step 5.

spring.application.name=library-transaction-service
server.port=8100

# Its own database, in memory, separate from the book database.
spring.datasource.url=jdbc:h2:mem:transactiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# fetch-registry matters more here than in book-service: this service has to READ
# the list to find out where library-book-service is.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Step 5: do not wait forever for the other service.
#
# Two seconds to connect, two seconds for an answer, then give up. Without a
# timeout, one slow service holds a thread here for every request, and when the
# threads run out this service stops answering too - a failure in one program
# spreading to another.
feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=2000
